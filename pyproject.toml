[project]
name = "doc-extractor-api"
version = "0.1.0"
description = "Turns invoices and orders (PDF or email) into validated data with AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Miquel Moreno", email = "miquel.moreno.martinez@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "faker>=40.39.0",
    "httpx>=0.28",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pypdf>=6.19.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "reportlab>=5.0.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_extractor_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Dev scripts: asserts for invariants; randomness is for fake data, not security.
"scripts/**" = ["S101", "S311"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/doc_extractor_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
